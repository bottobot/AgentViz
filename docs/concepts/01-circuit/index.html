<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Circuit Board - AgentViz concept 01</title>
<link rel="stylesheet" href="circuit.css">
</head>
<body>
<header id="top">
  <div class="brand"><span class="logo" aria-hidden="true">&#9107;</span><span>AgentViz</span><b>Circuit Board</b></div>
  <div id="identity" class="identity" aria-live="polite"></div>
  <div class="controls">
    <span id="mode" class="mode live" title="LIVE: following the session. HOLD: you are inspecting a moment or an item.">LIVE</span>
    <button id="backLive" class="btn" hidden>Back to live</button>
    <button id="pause" class="btn" aria-pressed="false">Pause</button>
    <div class="speed" role="group" aria-label="Simulation speed">
      <button class="btn" data-speed="0.5">0.5x</button><button class="btn on" data-speed="1">1x</button><button class="btn" data-speed="2">2x</button><button class="btn" data-speed="4">4x</button>
    </div>
  </div>
</header>
<main id="main">
  <section id="boardWrap" aria-label="Session circuit board">
    <svg id="board" viewBox="0 0 1200 760" preserveAspectRatio="xMidYMid meet" role="group" aria-label="The session as a circuit board. Tab through components and press Enter to probe one."></svg>
    <div id="legend" class="legend" aria-label="Legend">
      <span><i class="lg pulse"></i>amber pulse = data moving (size = tokens/bytes)</span>
      <span><i class="lg landed"></i>gold = landed / done</span>
      <span><i class="lg err"></i>&#9888; scorch + code = error</span>
      <span><i class="lg jumper"></i>jumper wire = retry</span>
      <span><i class="lg probe"></i>white dashes = probe (cause chain)</span>
      <span class="hint">Click or Tab+Enter any part, pulse, trace or timeline tick</span>
    </div>
  </section>
  <aside id="scope" aria-label="Probe inspector">
    <div class="scope-head">
      <span class="scope-brand">LA-7 PROBE <small>logic analyzer</small></span>
      <span id="probeMode" class="probe-mode"></span>
    </div>
    <div class="screen"><canvas id="scopeCanvas" aria-hidden="true"></canvas></div>
    <div id="insp" class="insp" tabindex="-1"></div>
  </aside>
</main>
<footer id="la">
  <canvas id="timeline" tabindex="0" aria-label="Logic analyzer timeline, last 30 minutes. Left and Right arrows step through calls, Enter opens the selected call, Escape returns to live."></canvas>
</footer>
<script src="../shared/sim.js"></script>
<script src="circuit.js"></script>
</body>
</html>
